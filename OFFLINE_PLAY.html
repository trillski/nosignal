function voting(){const isLive=ctx.mode==='live',isOffline=ctx.mode==='offline',voted=isLive?Boolean(ctx.myVote):Object.keys(ctx.votes).length===6;const voteRole=isOffline?ctx.viewRole:ctx.role;const chosen=isLive?(draftVote||ctx.myVote||{}):(ctx.votes[voteRole]||{});return `<div class="casebar"><span class="over">CHAPTER 08 / FINAL MINUTE</span><div class="stat">7 OF 7 LOCKS OPEN · ${isLive?ctx.voteCount:Object.keys(ctx.votes).length} / 6 VOTES</div></div><div class="over">23:59:59 / NO ROOM FOR A SECOND TAKE</div><h2>WHO OWNS THE SIGNAL?</h2><p class="storyline">Mara is safe, the original recording is ready, and the forged confession has been traced to Ren’s production session. Each investigator must choose what the team does next. This is a group decision.</p><div class="gamegrid"><div><div class="panel"><div class="over">TEAM EVIDENCE / VERIFIED</div><div class="receipt">CAM-08          MANUAL BLACKOUT / 23:47\nMER-02          REPLAYED BADGE ID 284\nDONATION BOARD  $36,000 UNVERIFIED UPLIFT\nMARA            FOUND AT SERVICE DOOR S3\nMASTER-2346     AUTHENTIC VOICE RECORDING\nQ-1159          SIGNED BY PROD-REN-21\nOVERRIDE        SIX CLEARANCES ACCEPTED</div><div class="notice info">The upload operator is established by evidence. The wider authorization chain involving the gala chair is not fully proven. Be precise in your accusation.</div>${ctx.mode==='offline'?`<div class="over">CAST EACH AGENT'S VOTE</div><p class="muted" style="font-size:13px">Select a role below, hand the device to that player, and let them vote. Solo players can choose for all six roles.</p><div class="actions">${R.map(r=>`<button class="btn sm ${voteRole===r.id?'':'alt'}" data-view="${r.id}">${esc(r.label)}${ctx.votes[r.id]?' ✓':''}</button>`).join('')}</div>`:''}${rosterHtmlForVoting()}</div></div><div><div class="panel"><div class="over">YOUR FINAL BALLOT ${isOffline?' / '+esc(roleOf(voteRole).label):''}</div>${isOffline&&voteRole==='all'?'<div class="notice warn">Select one role above before recording its vote.</div>':`<h3>Who queued the forged confession?</h3>${SUSPECTS.map(s=>`<button type="button" data-suspect="${s.id}" class="votecard ${chosen.suspect===s.id?'selected':''}"><b>${s.title}</b><small>${s.desc}</small></button>`).join('')}<h3 style="margin-top:21px">What should happen at midnight?</h3>${END_OPTIONS.map(s=>`<button type="button" data-voteaction="${s.id}" class="votecard ${chosen.action===s.id?'selected':''}"><b>${s.title}</b><small>${s.desc}</small></button>`).join('')}<div class="error" id="voteError" role="status"></div>${btn((isLive&&voted)?'UPDATE MY VOTE':'LOCK MY VOTE →','vote')}`}</div>${chatPanel()}</div></div><div class="notice">${isLive?'Once all six agents vote, the room will show the outcome automatically.': 'When all six role ballots are submitted, the outcome is revealed automatically.'} A tie in the broadcast decision sends evidence to auditors rather than guessing.</div>`}

function localSolve(){const s=S[ctx.stage],v=($('answer')?.value||'').trim().toUpperCase().replace(/[, $]/g,'');if(!v){$('answerError').textContent='Enter or select an answer first.';return}if(ctx.stage===6&&Object.keys(ctx.authorized||{}).length<6){$('answerError').textContent='All six fragments must be authorized first.';return}if(v===s.answer){ctx.stage++;ctx.maxUnlocked=Math.max(ctx.maxUnlocked||0,ctx.stage);toast(s.success);render();window.scrollTo({top:0,behavior:'smooth'})}else{ctx.tries++;$('answerError').textContent='ACCESS DENIED. Compare private evidence from different roles.';store()}}

async function request(path,data){let r=await fetch('/api/'+path,{method:path==='health'||path==='state'?'GET':'POST',headers:{'Content-Type':'application/json'},body:path==='health'||path==='state'?undefined:JSON.stringify(data||{})});let t=await r.json();if(!r.ok)throw new Error(t.error||'Network request failed');return t}
async function apiAction(path,payload){try{const p=await request(path,{token:ctx.token,...payload});if(p.error)throw Error(p.error);await loadState(true);return p}catch(e){toast(e.message);return null}}
async function loadState(force=false){if(serverBusy||ctx.mode!=='live')return;serverBusy=true;try{const r=await fetch('/api/state?token='+encodeURIComponent(ctx.token),{cache:'no-store'});const s=await r.json();if(!r.ok)throw Error(s.error||'Session expired');const version=JSON.stringify(s);if(version!==currentVersion||force){currentVersion=version;ctx={...ctx,...s,mode:'live',token:ctx.token,role:ctx.role,host:ctx.host};render()}}catch(e){clearInterval(pollTimer);toast(e.message);ctx.mode='home';render()}finally{serverBusy=false}}
async function createJoin(join){let name=(join?$('joinName'):$('hostName'))?.value?.trim()||'Investigator';const code=join?$('joinCode')?.value?.trim()?.toUpperCase():undefined;if(join&&(!code||code.length!==6)){errorMsg='Enter a six-character room code.';render();return}try{const r=await request(join?'join':'create',{role:ctx.role,name,code});ctx={...ctx,mode:'live',role:ctx.role,name,code:r.code,token:r.token,host:r.host,stage:-1,roster:[],votes:{}};try{sessionStorage.setItem('no-signal-v2-live',JSON.stringify({token:r.token,role:ctx.role,host:r.host,code:r.code,name}));}catch(_){}currentVersion='';render();clearInterval(pollTimer);pollTimer=setInterval(()=>loadState(),2000);await loadState(true)}catch(e){errorMsg=e.message;toast(e.message);render()}}
function copyCode(){if(navigator.clipboard&&location.protocol!=='file:')navigator.clipboard.writeText(ctx.code).then(()=>toast('Room code copied')).catch(()=>toast('Copy the room code displayed'));else toast('Copy the six-character code displayed')}
async function doVote(){const v=ctx.mode==='offline'?ctx.viewRole:ctx.role;if(v==='all'){toast('Select a role before voting');return}const chosen=(ctx.mode==='live'?(draftVote||ctx.myVote||{}):(ctx.votes[v]||{}));if(!chosen.action||!chosen.suspect){$('voteError').textContent='Choose a suspect and a broadcast decision.';return}if(ctx.mode==='live'){const ack=await apiAction('vote',{suspect:chosen.suspect,action:chosen.action});if(ack)draftVote=null;return}ctx.votes[v]={...chosen};if(Object.values(ctx.votes).filter(v=>v.action&&v.suspect).length===6){ctx.result=computeEnding(ctx.votes);ctx.stage=8;toast('Six votes counted. The midnight signal is decided.')}render()}
const handlers={backHome(){clearInterval(pollTimer);ctx.mode='home';ctx.stage=-2;render()},help(){ctx.mode='help';render()},offlineScreen(){ctx.mode='offlineSetup';render()},resumeOffline(){if(savedOffline){ctx={...ctx,...savedOffline,mode:'offline'};render()}else handlers.offlineScreen()},createScreen(){ctx.mode='liveSetup';render()},offlineStart(){newOffline('offline')},agentStart(){newOffline('agent')},createLive(){createJoin(false)},joinLive(){createJoin(true)},copyCode,async answer(){if(ctx.mode==='live'){const v=($('answer')?.value||'').trim();const r=await apiAction('answer',{answer:v});if(r?.correct)toast('Lock opened / team advancing');else if(r&&r.correct===false)$('answerError')&&($('answerError').textContent='ACCESS DENIED / compare the evidence');}else localSolve()},hint(){if(ctx.mode==='live')apiAction('hint');else localHint()},async authorize(){if(ctx.mode==='live'){await apiAction('authorize');return}if(ctx.mode==='offline'){const r=ctx.viewRole;if(r==='all'){R.forEach(x=>ctx.authorized[x.id]=true)}else ctx.authorized[r]=true;render();return}toast('Ask the director to collect your authorization')},async chat(){const x=$('chatText');const t=x?.value.trim();if(!t)return;x.value='';await apiAction('chat',{text:t})},vote:doVote,reset(){ctx.stage=0;ctx.maxUnlocked=0;ctx.tries=0;ctx.hints={};ctx.votes={};ctx.authorized={};ctx.result=null;render()},leave(){clearInterval(pollTimer);ctx.mode='home';render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-role],[data-pick-role],[data-view],[data-chapter],[data-suspect],[data-voteaction]');if(!b)return;if(b.dataset.action){handlers[b.dataset.action]?.();return}const picked=b.getAttribute('data-pick-role');if(picked){ctx.role=picked;document.querySelectorAll('[data-pick-role]').forEach(el=>{const on=el.getAttribute('data-pick-role')===picked;el.classList.toggle('selected',on);el.setAttribute('aria-pressed',String(on))});return}if(b.dataset.view){ctx.viewRole=b.dataset.view;render();return}if(b.dataset.chapter&&ctx.mode==='agent'){ctx.stage=Number(b.dataset.chapter);render();return}if(b.dataset.chapter&&ctx.mode==='offline'){if(Number(b.dataset.chapter)<=ctx.stage){ctx.stage=Number(b.dataset.chapter);render()}return}if(b.dataset.suspect){if(ctx.mode==='offline'){let r=ctx.viewRole;if(r==='all')return;ctx.votes[r]={...(ctx.votes[r]||{}),suspect:b.dataset.suspect}}else draftVote={...(draftVote||ctx.myVote||{}),suspect:b.dataset.suspect};render();return}if(b.dataset.voteaction){if(ctx.mode==='offline'){let r=ctx.viewRole;if(r==='all')return;ctx.votes[r]={...(ctx.votes[r]||{}),action:b.dataset.voteaction}}else draftVote={...(draftVote||ctx.myVote||{}),action:b.dataset.voteaction};render();return}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'){e.preventDefault();handlers.answer()}if(e.key==='Enter'&&e.target.id==='chatText'){e.preventDefault();handlers.chat()}});
(async function init(){try{if(location.protocol.startsWith('http')){let r=await fetch('/api/health',{signal:AbortSignal.timeout(1400)});onlineSupported=r.ok&&Boolean((await r.json()).ok)}}catch(_){}try{if(onlineSupported){const x=JSON.parse(sessionStorage.getItem('no-signal-v2-live')||'null');if(x?.token){ctx={...ctx,...x,mode:'live',stage:-1};pollTimer=setInterval(()=>loadState(),2000);await loadState(true);return}}}catch(_){}render()})();
})();

</script></body></html>
